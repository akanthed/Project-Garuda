<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Garuda Catalyst Services Architecture</title>
  <desc id="desc">Sixteen Catalyst capabilities supporting Garuda's police intelligence and operational response workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071310"/>
      <stop offset="0.56" stop-color="#0c1a18"/>
      <stop offset="1" stop-color="#111b22"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4b942"/>
      <stop offset="1" stop-color="#f28c28"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#d8eee7" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .display { font-family: Bahnschrift, 'Arial Narrow', sans-serif; letter-spacing: 0; }
      .body { font-family: 'Segoe UI', sans-serif; letter-spacing: 0; }
      .section { font: 700 17px Bahnschrift, sans-serif; fill: #9bb6ae; letter-spacing: 0; }
      .card-title { font: 700 19px 'Segoe UI', sans-serif; fill: #f4faf7; letter-spacing: 0; }
      .card-copy { font: 400 13px 'Segoe UI', sans-serif; fill: #a9bcb6; letter-spacing: 0; }
      .icon { font: 700 14px Bahnschrift, sans-serif; fill: #071310; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .card { fill: #12231f; stroke: #294139; stroke-width: 1; }
      .ai-card { fill: #132228; stroke: #2e4650; stroke-width: 1; }
      .line { fill: none; stroke: #52746b; stroke-width: 2; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 120H1600" stroke="#28413a"/>

  <g transform="translate(64 42)">
    <rect width="48" height="48" rx="8" fill="url(#hero)"/>
    <text x="24" y="26" class="display" font-size="25" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="#071310">G</text>
    <text x="66" y="21" class="display" font-size="30" font-weight="800" fill="#f4faf7">GARUDA</text>
    <text x="66" y="45" class="body" font-size="14" fill="#9bb6ae">Karnataka Police Intelligence &amp; ActionLoop</text>
  </g>
  <text x="1536" y="61" class="display" font-size="16" font-weight="700" text-anchor="end" fill="#f4b942">BUILT ON ZOHO CATALYST</text>
  <text x="1536" y="86" class="body" font-size="13" text-anchor="end" fill="#89a39b">16 integrated cloud and AI capabilities</text>

  <text x="64" y="158" class="section">EXPERIENCE &amp; OPERATIONAL PLATFORM</text>
  <text x="555" y="158" class="section">AI &amp; INTELLIGENCE</text>
  <text x="1212" y="158" class="section">AUTOMATION &amp; TRUST</text>

  <!-- Left: platform -->
  <g filter="url(#shadow)">
    <rect x="64" y="181" width="445" height="98" rx="8" class="card"/>
    <rect x="82" y="201" width="42" height="42" rx="7" fill="#50c7a5"/>
    <text x="103" y="223" class="icon">WEB</text>
    <text x="142" y="217" class="card-title">Web Client Hosting</text>
    <text x="142" y="241" class="card-copy">React/Vite role-aware web application</text>
    <rect x="142" y="253" width="92" height="3" rx="2" fill="#50c7a5"/>

    <rect x="64" y="295" width="445" height="98" rx="8" class="card"/>
    <rect x="82" y="315" width="42" height="42" rx="7" fill="#f4b942"/>
    <text x="103" y="337" class="icon">API</text>
    <text x="142" y="331" class="card-title">AppSail</text>
    <text x="142" y="355" class="card-copy">Python 3.11 FastAPI + NetworkX runtime</text>
    <rect x="142" y="367" width="68" height="3" rx="2" fill="#f4b942"/>
  </g>

  <path d="M286 279V295" class="line"/>

  <g filter="url(#shadow)">
    <rect x="64" y="425" width="214" height="112" rx="8" class="card"/>
    <rect x="82" y="443" width="38" height="38" rx="7" fill="#6eb5e7"/>
    <text x="101" y="463" class="icon">DB</text>
    <text x="132" y="457" class="card-title" font-size="17">Data Store + ZCQL</text>
    <text x="82" y="500" class="card-copy">Crime, workflow and</text>
    <text x="82" y="519" class="card-copy">operational records</text>

    <rect x="295" y="425" width="214" height="112" rx="8" class="card"/>
    <rect x="313" y="443" width="38" height="38" rx="7" fill="#b7d66b"/>
    <text x="332" y="463" class="icon">NS</text>
    <text x="363" y="457" class="card-title">NoSQL</text>
    <text x="313" y="500" class="card-copy">Append-only agent, operation</text>
    <text x="313" y="519" class="card-copy">and delivery audit events</text>

    <rect x="64" y="554" width="214" height="112" rx="8" class="card"/>
    <rect x="82" y="572" width="38" height="38" rx="7" fill="#ef8b73"/>
    <text x="101" y="592" class="icon">C</text>
    <text x="132" y="586" class="card-title">Cache</text>
    <text x="82" y="629" class="card-copy">Six-hour network analytics</text>
    <text x="82" y="648" class="card-copy">snapshot across restarts</text>

    <rect x="295" y="554" width="214" height="112" rx="8" class="card"/>
    <rect x="313" y="572" width="38" height="38" rx="7" fill="#c6a6e8"/>
    <text x="332" y="592" class="icon">ST</text>
    <text x="363" y="586" class="card-title">Stratus</text>
    <text x="313" y="629" class="card-copy">Encrypted, versioned field</text>
    <text x="313" y="648" class="card-copy">evidence and attachments</text>
  </g>

  <!-- Center: Garuda and AI -->
  <g filter="url(#shadow)">
    <rect x="555" y="181" width="610" height="144" rx="8" fill="#172a25" stroke="#f4b942" stroke-width="1.5"/>
    <text x="860" y="217" class="display" font-size="26" font-weight="800" text-anchor="middle" fill="#f7fbf9">INTELLIGENCE TO ACTION</text>
    <text x="860" y="242" class="body" font-size="14" text-anchor="middle" fill="#a9bcb6">A governed operational loop, not a prediction-only dashboard</text>
    <g transform="translate(593 270)">
      <rect width="96" height="34" rx="6" fill="#24433a"/><text x="48" y="22" class="body" font-size="13" font-weight="700" text-anchor="middle" fill="#dff5ed">DETECT</text>
      <path d="M103 17H121" stroke="#f4b942" stroke-width="2"/><path d="m116 12 6 5-6 5" fill="none" stroke="#f4b942" stroke-width="2"/>
      <rect x="128" width="104" height="34" rx="6" fill="#24433a"/><text x="180" y="22" class="body" font-size="13" font-weight="700" text-anchor="middle" fill="#dff5ed">EXPLAIN</text>
      <path d="M239 17H257" stroke="#f4b942" stroke-width="2"/><path d="m252 12 6 5-6 5" fill="none" stroke="#f4b942" stroke-width="2"/>
      <rect x="264" width="88" height="34" rx="6" fill="#24433a"/><text x="308" y="22" class="body" font-size="13" font-weight="700" text-anchor="middle" fill="#dff5ed">ASSIGN</text>
      <path d="M359 17H377" stroke="#f4b942" stroke-width="2"/><path d="m372 12 6 5-6 5" fill="none" stroke="#f4b942" stroke-width="2"/>
      <rect x="384" width="86" height="34" rx="6" fill="#24433a"/><text x="427" y="22" class="body" font-size="13" font-weight="700" text-anchor="middle" fill="#dff5ed">ACT</text>
      <path d="M477 17H495" stroke="#f4b942" stroke-width="2"/><path d="m490 12 6 5-6 5" fill="none" stroke="#f4b942" stroke-width="2"/>
      <rect x="502" width="74" height="34" rx="6" fill="#24433a"/><text x="539" y="22" class="body" font-size="13" font-weight="700" text-anchor="middle" fill="#dff5ed">LEARN</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="555" y="349" width="193" height="103" rx="8" class="ai-card"/>
    <rect x="571" y="365" width="35" height="35" rx="7" fill="#50c7a5"/><text x="588.5" y="383" class="icon">O</text>
    <text x="618" y="379" class="card-title">Connections</text>
    <text x="571" y="420" class="card-copy">Managed OAuth for AI</text><text x="571" y="438" class="card-copy">and RAG services</text>

    <rect x="764" y="349" width="193" height="103" rx="8" class="ai-card"/>
    <rect x="780" y="365" width="35" height="35" rx="7" fill="#f4b942"/><text x="797.5" y="383" class="icon">ML</text>
    <text x="827" y="379" class="card-title">Prediction</text>
    <text x="780" y="420" class="card-copy">Risk, forecast and</text><text x="780" y="438" class="card-copy">anomaly models</text>

    <rect x="973" y="349" width="192" height="103" rx="8" class="ai-card"/>
    <rect x="989" y="365" width="35" height="35" rx="7" fill="#ef8b73"/><text x="1006.5" y="383" class="icon">LLM</text>
    <text x="1036" y="379" class="card-title">LLM Serving</text>
    <text x="989" y="420" class="card-copy">Ask Garuda planning</text><text x="989" y="438" class="card-copy">with controlled tools</text>

    <rect x="555" y="469" width="193" height="103" rx="8" class="ai-card"/>
    <rect x="571" y="485" width="35" height="35" rx="7" fill="#c6a6e8"/><text x="588.5" y="503" class="icon">R</text>
    <text x="618" y="499" class="card-title">RAG + KB</text>
    <text x="571" y="540" class="card-copy">Cited guidance from the</text><text x="571" y="558" class="card-copy">operational playbook</text>

    <rect x="764" y="469" width="193" height="103" rx="8" class="ai-card"/>
    <rect x="780" y="485" width="35" height="35" rx="7" fill="#6eb5e7"/><text x="797.5" y="503" class="icon">NLP</text>
    <text x="827" y="499" class="card-title">Trained NLP</text>
    <text x="780" y="540" class="card-copy">Speech-to-text, voice</text><text x="780" y="558" class="card-copy">output and translation</text>

    <rect x="973" y="469" width="192" height="103" rx="8" class="ai-card"/>
    <rect x="989" y="485" width="35" height="35" rx="7" fill="#b7d66b"/><text x="1006.5" y="503" class="icon">OCR</text>
    <text x="1036" y="499" class="card-title">Zia OCR + NER</text>
    <text x="989" y="540" class="card-copy">Scanned FIR to a</text><text x="989" y="558" class="card-copy">reviewed incident draft</text>

    <rect x="659" y="589" width="402" height="92" rx="8" class="ai-card"/>
    <rect x="678" y="607" width="38" height="38" rx="7" fill="#f28c28"/><text x="697" y="627" class="icon">PDF</text>
    <text x="732" y="622" class="card-title">SmartBrowz</text>
    <text x="732" y="647" class="card-copy">Intelligence briefs and operation debriefs</text>
    <rect x="732" y="660" width="105" height="3" rx="2" fill="#f28c28"/>
  </g>

  <!-- Right: automation and trust -->
  <g filter="url(#shadow)">
    <rect x="1212" y="181" width="324" height="112" rx="8" class="card"/>
    <rect x="1232" y="201" width="42" height="42" rx="7" fill="#f4b942"/>
    <text x="1253" y="223" class="icon">JS</text>
    <text x="1288" y="217" class="card-title">Job Scheduling</text>
    <text x="1232" y="262" class="card-copy">Daily outcome assessments at 02:00 IST</text>

    <rect x="1212" y="309" width="324" height="112" rx="8" class="card"/>
    <rect x="1232" y="329" width="42" height="42" rx="7" fill="#50c7a5"/>
    <text x="1253" y="351" class="icon">SG</text>
    <text x="1288" y="345" class="card-title">Signals</text>
    <text x="1232" y="390" class="card-copy">Data Store events trigger lifecycle actions</text>
  </g>

  <path d="M1212 237H1179V619H1061" class="line"/>
  <path d="M1212 365H1188" class="line"/>

  <rect x="1212" y="453" width="324" height="213" rx="8" fill="#111e1c" stroke="#385148"/>
  <text x="1234" y="486" class="display" font-size="17" font-weight="700" fill="#f4b942">TRUST BY DESIGN</text>
  <g class="body" font-size="14" fill="#dce9e4">
    <circle cx="1241" cy="521" r="5" fill="#50c7a5"/><text x="1258" y="526">Human review before action</text>
    <circle cx="1241" cy="558" r="5" fill="#6eb5e7"/><text x="1258" y="563">Role and scope enforcement</text>
    <circle cx="1241" cy="595" r="5" fill="#c6a6e8"/><text x="1258" y="600">Append-only audit evidence</text>
    <circle cx="1241" cy="632" r="5" fill="#ef8b73"/><text x="1258" y="637">Explainable model fallbacks</text>
  </g>

  <!-- Footer -->
  <rect x="64" y="720" width="1472" height="118" rx="8" fill="#0d1917" stroke="#294139"/>
  <text x="92" y="754" class="display" font-size="17" font-weight="700" fill="#f4b942">LIVE PROOF, NOT A CONCEPT DIAGRAM</text>
  <g class="body">
    <text x="92" y="792" font-size="27" font-weight="700" fill="#f4faf7">124,000</text><text x="214" y="791" font-size="13" fill="#9bb6ae">CASES</text>
    <line x1="292" y1="760" x2="292" y2="812" stroke="#294139"/>
    <text x="326" y="792" font-size="27" font-weight="700" fill="#f4faf7">44,799</text><text x="448" y="791" font-size="13" fill="#9bb6ae">GRAPH NODES</text>
    <line x1="566" y1="760" x2="566" y2="812" stroke="#294139"/>
    <text x="600" y="792" font-size="27" font-weight="700" fill="#f4faf7">3</text><text x="626" y="791" font-size="13" fill="#9bb6ae">DEPLOYED PREDICTIVE MODELS</text>
    <line x1="866" y1="760" x2="866" y2="812" stroke="#294139"/>
    <text x="900" y="792" font-size="27" font-weight="700" fill="#f4faf7">EN + KN</text><text x="1022" y="791" font-size="13" fill="#9bb6ae">VOICE &amp; UI</text>
    <line x1="1122" y1="760" x2="1122" y2="812" stroke="#294139"/>
    <text x="1156" y="792" font-size="27" font-weight="700" fill="#f4faf7">24/7</text><text x="1231" y="791" font-size="13" fill="#9bb6ae">EVENT-DRIVEN ACTION LOOP</text>
  </g>
  <text x="1536" y="871" class="body" font-size="12" text-anchor="end" fill="#718a82">Garuda · Detect risk · Understand connections · Plan the response</text>
</svg>